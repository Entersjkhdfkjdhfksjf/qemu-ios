plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ipodtouch.emulator'
    compileSdk 34

    defaultConfig {
        applicationId 'app.ipodtouch.emulator'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        shared {
            // Throwaway key committed on purpose so every CI build is update-compatible.
            storeFile file('../../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    sourceSets {
        main {
            // SDL's Java half, copied out of the SDL release that matches libSDL2.so
            java.srcDirs = ['src/main/java', '../../prefix/sdl-java']
        }
    }

    packaging {
        jniLibs { keepDebugSymbols += ['**/*.so'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
