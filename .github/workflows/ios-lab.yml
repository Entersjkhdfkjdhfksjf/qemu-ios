name: iOS lab (headless)

on:
  push:
    branches: [ios-lab]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify firmware keys and map iBoot strings (reports only, nothing stored)
        run: |
          mkdir -p lab/out
          for p in ipod2_1_2.1.1_5F138 ipod2_1_3.1.3_7E18; do
            echo "=================== $p"
            python3 lab/analyze_ipsw.py lab/profiles/$p.json /tmp/ipsw-$p 2>&1
          done | tee lab/out/keys-report.txt
      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash lab/publish.sh keys-latest lab/out/keys-report.txt

  lab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv libssl-dev libsdl2-dev \
            libpixman-1-dev libglib2.0-dev ccache unzip clang

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-lab-arm

      - name: Build QEMU (native arm64, clang, arm-softmmu)
        run: |
          mkdir -p build-lab && cd build-lab
          ../configure --enable-sdl --target-list=arm-softmmu --disable-capstone --disable-slirp \
            --disable-werror --disable-docs --extra-cflags=-I/usr/include/openssl --extra-ldflags=-lcrypto \
            --cc="ccache clang" 2>&1 | tail -15
          ninja -j"$(nproc)" qemu-system-arm 2>&1 | tail -5

      - name: Run lab
        run: bash lab/run-lab.sh

      - name: Publish lab logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          [ -f lab/out/summary.txt ] && cp lab/out/summary.txt /tmp/out/
          for f in serial stdout stderr unimp; do
            [ -f lab/out/$f.log ] && { head -n 300 lab/out/$f.log > /tmp/out/$f.head; tail -n 1500 lab/out/$f.log > /tmp/out/$f.tail; }
          done
          cp lab/config.env /tmp/out/config.env
          bash lab/publish.sh lab-latest /tmp/out/*
