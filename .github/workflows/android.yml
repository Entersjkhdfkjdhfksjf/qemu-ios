name: Android (arm64)

on:
  push:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv python3-packaging cmake meson gcc g++ make perl xz-utils

      - name: Restore cross-built dependencies
        uses: actions/cache/restore@v4
        with:
          path: android/prefix
          key: android-deps-v1-${{ github.run_id }}
          restore-keys: android-deps-v1-

      - name: Build dependencies
        run: bash android/build-deps.sh 2>&1 | tee android/deps.log

      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: android/prefix
          key: android-deps-v1-${{ github.run_id }}

      - name: Build QEMU (libmain.so)
        run: bash android/build-qemu.sh 2>&1 | tee android/qemu.log

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-arm64
          path: android/out/*.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          mkdir -p android/project/app/src/main/jniLibs/arm64-v8a
          cp android/out/libmain.so android/out/libSDL2.so android/project/app/src/main/jniLibs/arm64-v8a/
          cd android/project
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../gradle.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipod-touch-apk
          path: android/project/app/build/outputs/apk/release/*.apk

      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/project/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" /tmp/ipod-touch-qemu.apk
          gh release delete android-latest --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create android-latest /tmp/ipod-touch-qemu.apk --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Android build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. No Apple firmware is included; import it in the app."

      - name: Publish log tails to ci-logs branch
        if: always()
        run: |
          set +e
          mkdir -p /tmp/out
          for f in android/deps.log android/qemu.log android/gradle.log; do
            [ -f "$f" ] && tail -n 3000 "$f" > "/tmp/out/$(basename "$f")"
          done
          [ -f build-android/config.log ] && tail -n 400 build-android/config.log > /tmp/out/config.log.tail
          [ -f build-android/meson-logs/meson-log.txt ] && tail -n 400 build-android/meson-logs/meson-log.txt > /tmp/out/qemu-meson-log.tail
          for f in android/work/src/*/_b/meson-logs/meson-log.txt; do
            [ -f "$f" ] && tail -n 300 "$f" > "/tmp/out/$(echo "$f" | cut -d/ -f4)-meson-log.tail"
          done
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch ci-logs "$URL" /tmp/cil 2>/dev/null || {
            mkdir /tmp/cil; git -C /tmp/cil init -q -b ci-logs; git -C /tmp/cil remote add origin "$URL"; }
          rm -rf /tmp/cil/latest; mkdir -p /tmp/cil/latest
          cp /tmp/out/* /tmp/cil/latest/ 2>/dev/null
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > /tmp/cil/latest/RUN
          cd /tmp/cil && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logs for run ${{ github.run_id }}"
          git push origin HEAD:ci-logs
